<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b"/>
      <stop offset="50%" stop-color="#0f766e"/>
      <stop offset="100%" stop-color="#042f2e"/>
    </linearGradient>
    <linearGradient id="flameGrad" x1="0%" y1="100%" x2="50%" y2="0%">
      <stop offset="0%" stop-color="#ea580c"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#fef08a"/>
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="110" fill="url(#bgGrad)"/>

  <!-- Shield Base (Safety / Protection) -->
  <path d="M 256 80 L 370 135 C 370 250 320 340 256 390 C 192 340 142 250 142 135 Z" 
        fill="url(#shieldGrad)" opacity="0.3" stroke="#34d399" stroke-width="6" />

  <!-- Radar / IoT Sensor Waves -->
  <circle cx="256" cy="270" r="140" fill="none" stroke="#6ee7b7" stroke-width="4" stroke-dasharray="12 10" opacity="0.4" />
  <circle cx="256" cy="270" r="100" fill="none" stroke="#6ee7b7" stroke-width="4" stroke-dasharray="8 8" opacity="0.6" />

  <!-- Stylized Flame & Peat Forest Leaf Core -->
  <!-- Outer Flame -->
  <path d="M 256 160 C 290 220 330 260 330 310 C 330 360 295 390 256 390 C 217 390 182 360 182 310 C 182 250 220 200 256 160 Z" 
        fill="url(#flameGrad)" filter="url(#glow)"/>

  <!-- Inner Ember / Sensor Eye -->
  <path d="M 256 220 C 275 260 295 285 295 315 C 295 345 277 365 256 365 C 235 365 217 345 217 315 C 217 280 238 250 256 220 Z" 
        fill="#ffffff" opacity="0.9"/>

  <!-- IoT Transmission Nodes -->
  <circle cx="256" cy="120" r="14" fill="#38bdf8" stroke="#ffffff" stroke-width="3"/>
  <line x1="256" y1="134" x2="256" y2="160" stroke="#38bdf8" stroke-width="3" stroke-linecap="round"/>

  <!-- Base Label Dot -->
  <circle cx="256" cy="325" r="12" fill="#ea580c"/>
</svg>
